[package]
name = "botplate"
version = "0.8.0"
edition = "2024"

[dependencies]
poise = "0.6.2"
sysinfo = "0.39.3"
tokio = { version = "1.52.3", features = ["full"] }
sea-orm = { version = "1.1.20", features = [ "sqlx-sqlite", "runtime-tokio-rustls", "macros" ] }
rand = "0.10.2"
dotenvy = "0.15.7"
chrono = "0.4.45"
dashmap = "6.2.1"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
redundant_clone = "warn"
print_stdout = "warn"
print_stderr = "warn"
